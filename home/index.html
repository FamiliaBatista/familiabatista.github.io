<!DOCTYPE html>
<html>
    <head>
        <title>The Familia Batista</title>
        <link rel="stylesheet" href="home.css">
        <script src="home.js"></script>
        <link href="https://fonts.cdnfonts.com/css/marhey" rel="stylesheet">
    </head>
    <body>
        <div>
            <div id="main-header">
                <img class="logo" src="../common/images/FamiliaBatistaLogo.png">
                <div class="nav-elements">
                    <div class="nav-button" onclick="location.href='../recipes'">
                        <img src="../common/images/recipes-icon.svg">
                    </div>
                </div>
            </div>
            <div class="main">
                <div id="slideshow">
                    <div id="home-slideshow" class="slideshow-container">
                        <div class="slideshow-slide slideshow-visible">
                            <div class="slideshow-text">1 / 5</div>
                            <img class="slideshow-image" src="./images/slide1.jpg" style="width: 100%;">
                        </div>
                        <div class="slideshow-slide">
                            <div class="slideshow-text">2 / 5</div>
                            <img class="slideshow-image" src="./images/slide2.jpg" style="width: 100%;">
                        </div>
                        <div class="slideshow-slide">
                            <div class="slideshow-text">3 / 5</div>
                            <img class="slideshow-image" src="./images/slide3.jpg" style="width: 100%;">
                        </div>
                        <div class="slideshow-slide">
                            <div class="slideshow-text">4 / 5</div>
                            <img class="slideshow-image" src="./images/slide4.jpg" style="width: 100%;">
                        </div>
                        <div class="slideshow-slide">
                            <div class="slideshow-text">5 / 5</div>
                            <img class="slideshow-image" src="./images/slide5.jpg" style="width: 100%;">
                        </div>
                        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                        <a class="next" onclick="plusSlides(1)">&#10095;</a>

                    </div>
                    <div style="text-align:center">
                        <span class="dot" onclick="currentSlide(1)"></span>
                        <span class="dot" onclick="currentSlide(2)"></span>
                        <span class="dot" onclick="currentSlide(3)"></span>
                        <span class="dot" onclick="currentSlide(4)"></span>
                        <span class="dot" onclick="currentSlide(5)"></span>
                    </div>
                </div>
                <div id="textarea">
                    <p id="established">Est. 1998</p>
                    <p class="welcome-blurb">Welcome to FamiliaBatista.com! Thanks for taking a special interest in our family. Feel free to look around! We have recipes to share, experiences to recount, and jokes to laugh at.</p>
                    <p class="welcome-blurb">Thanks!</p>
                </div>
            </div>
        </div>
    </body>
</html>
